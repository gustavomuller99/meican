version: '3'

services:
  hardhat:
    image: meican-hardhat-dev
    build:
      context: .
      dockerfile: docker_for_build/hardhat/Dockerfile
    container_name: meican-hardhat-dev
    ports:
      - "8545:8545"
    volumes:
      - hardhat-shared:/shared
    healthcheck:
      test: ["CMD", "curl", "-sf", "-X", "POST", "-H", "Content-Type: application/json", "--data", "{\"jsonrpc\":\"2.0\",\"method\":\"net_version\",\"id\":1}", "http://localhost:8545"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  meican:
    image: meican-app-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: docker_for_build/dev/Dockerfile
      args:
        - MEICAN_VERSION
    container_name: meican-app-dev
    entrypoint: ["./docker_for_build/wait-for-mysql.sh", "db", "/entrypoint.sh", "dev"]
    volumes:
      - ./:/home/meican/meican-$MEICAN_VERSION
      - hardhat-shared:/shared
    environment:
      - CIRCUIT_LIFECYCLE_LOGGER
      - BLOCKCHAIN_RPC_URL
      - BLOCKCHAIN_CHAIN_ID
      - BLOCKCHAIN_SIGNER_PRIVATE_KEY
      - BLOCKCHAIN_CONTRACT_ADDRESS
    depends_on:
      hardhat:
        condition: service_healthy
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: meican-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    restart: always
    ports:
      - 8081:80
    depends_on:
      - db
    links:
      - db

volumes:
  hardhat-shared:
